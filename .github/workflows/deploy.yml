# main에 push하면: PDF 생성 → 사이트 + PDF를 GitHub Pages로 배포
# 저장소 Settings → Pages → Source를 "GitHub Actions"로 설정해야 해요.
name: Build PDF & Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium + Korean fonts
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk

      - name: Build PDF
        run: npm run pdf

      - name: Assemble site
        run: |
          mkdir _site
          cp index.html style.css print.css portfolio.pdf _site/
          if [ -d assets ]; then cp -r assets _site/; fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
